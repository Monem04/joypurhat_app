name: joypurhat
description: "Joypurhat: a directory of services in Joypurhat district, Bangladesh."
publish_to: 'none'

# versionName+versionCode. Raise the number after + for every Play Store upload.
version: 1.1.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/joypurhat.json
    - assets/photos/
    - assets/fonts/OFL.txt
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
